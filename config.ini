# Configuration file for Voter Data Management System
# Environment-based settings

# Flask Configuration
FLASK_ENV=development
FLASK_DEBUG=True
SECRET_KEY=your-secret-key-here

# Database
DATABASE_PATH=voters.db
DB_BACKUP_PATH=backups/

# File Upload
MAX_FILE_SIZE=52428800  # 50MB in bytes
ALLOWED_FILE_TYPES=pdf
UPLOAD_FOLDER=uploads/

# API Configuration
API_HOST=0.0.0.0
API_PORT=5000
API_CORS_ORIGIN=*

# PDF Parser
PDF_PARSER_TYPE=pdfplumber
MIN_BOOTH_NUMBER_LENGTH=1
MAX_BOOTH_NUMBER_LENGTH=4

# Voter ID (EPIC) Format
# State Code: 2 letters (e.g., KA, TN, AP)
# District: 2 digits
# Serial: 7 alphanumeric characters
EPIC_FORMAT_REGEX=^[A-Z]{2}\d{2}[A-Z0-9]{7}$

# Search Configuration
MIN_SEARCH_LENGTH=2
MAX_SEARCH_RESULTS=500

# Database Indexes
CREATE_INDEXES=True

# Logging
LOG_LEVEL=INFO
LOG_FILE=voter_system.log

# Features
ENABLE_CLEAR_DATA=True
ENABLE_STATS_API=True
ENABLE_BOOTH_MANAGEMENT=True

# CORS Settings
CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS
CORS_ALLOW_HEADERS=Content-Type,Authorization
